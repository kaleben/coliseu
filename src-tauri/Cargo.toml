[package]
name = "coliseu"
version = "0.1.0"
description = "Terminais organizados por grupo para Claude Code / Codex"
authors = ["Colaboradores do Coliseu"]
license = "MIT"
repository = "https://github.com/kaleben/coliseu"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "coliseu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
uuid = { version = "1.29.2", features = ["v4"] }
dirs = "7.0.0"
anyhow = "1.0.104"
parking_lot = "0.13.0"
tauri-plugin-clipboard-manager = "2.5.0"
notify-rust = "4.19.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11.1"
base64 = "0.23.1"
flate2 = "1.1.11"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["net", "sync", "rt-multi-thread", "macros"] }
futures-util = "0.3.34"
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
web-push = { version = "0.11.0", default-features = false }
tauri-plugin-dialog = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
